function helpModal(){
  showModal({eyebrow:"THE RULES",title:"How it works",body:
    "<p><b>One real minute is one worked hour.</b> The day runs 08:00 to 18:00, so a business day takes ten real minutes. At 18:00 you punch out and settle up. Every fourth day the board reviews you.</p>"+
    "<p><b>Three rates decide today.</b> Units built, units your closers can move, and how many buyers actually want your product. Revenue is the smallest of the three. The Floor tab names your bottleneck.</p>"+
    "<p><b>Demand isn't a dial — it's a fight.</b> Three rivals sell into the same Budget, Mainstream and Premium segments across three regions. Your price, quality and brand decide which segments you take share in. Cheap wins Budget; only quality and brand win Premium.</p>"+
    "<p><b>Strategy costs money every day and pays off later.</b> Quality programs, brand campaigns, lean lines, new production cells and market entries take three to five days and drain cash the whole time — while payroll still comes due each night.</p>"+
    "<p><b>You start as the whole company.</b> Day one is you, a bench and eight units. Pick where your own ten hours go — building, selling, out front, or managing — then hire people to take those jobs off you. Managers do almost nothing until you put them over a department.</p>"+
    "<p>It's you against three simulated rivals. Nobody else plays, nothing connects to the internet, and the whole game is this one file.</p>"+
    "<p><b>You can buy other businesses, and sell your own.</b> The Deals desk lists suppliers, freight firms, retail chains, design studios and distributors you can buy outright — each folds its effect into your company and costs upkeep every day. You can buy a rival out entirely, which hands you their customers and their footprint. Everything you own can be sold back at 60% when cash gets tight, and you can sell the whole company at any time to end the run with a number.</p>"+
    "<p><b>Nobody can fire you while you're private.</b> Every fourth day you close the books. Clear four bars — $120,000 equity, two profitable quarters in a row, quality 6, and 7% share — and an underwriter offers to take you public. Sell a small slice and keep control, or a big slice for the cash to go to war.</p>"+
    "<p><b>After the IPO the board arrives</b> with three numbers every quarter: EPS, market share, share price. Hit two of three. Three strikes and they replace you. Market cap of $4,000,000 finishes it.</p>",
    options:[{label:"Back to work",detail:"space bar pauses",run:()=>closeModal()}]});
}

/* ── saving · straight to the device, no accounts ──────────────
   Everything lives in this browser's own storage. If a browser blocks
   it (private mode, a locked-down viewer), the game keeps running and
   falls back to the save code you can copy by hand. */
const STORE=(()=>{
  const KEY="shiftwork.save.v1"; let ok=false;
  try{ const t=KEY+".probe"; localStorage.setItem(t,"1"); localStorage.removeItem(t); ok=true; }catch(e){ ok=false; }
  return { ok,
    read(){ if(!ok) return null; try{ return localStorage.getItem(KEY); }catch(e){ return null; } },
    write(v){ if(!ok) return false; try{ localStorage.setItem(KEY,v); return true; }catch(e){ return false; } },
    clear(){ if(!ok) return; try{ localStorage.removeItem(KEY); }catch(e){} } };
})();

let lastAuto=0, lastAutoOk=false;
function autosave(force){
  if(!STORE.ok||!S) return;
  if(S.over){ STORE.clear(); return; }
  const now=Date.now();
  if(!force&&now-lastAuto<8000) return;
  lastAuto=now; S.savedAt=now;
  lastAutoOk=STORE.write(JSON.stringify(S));
}
function savedAgo(){
  if(!S.savedAt) return "not saved yet this session";
  const m=Math.round((Date.now()-S.savedAt)/60000);
  return m<1?"saved moments ago":m===1?"saved a minute ago":"saved "+m+" minutes ago";
}
function encodeSave(){ try{ return btoa(unescape(encodeURIComponent(JSON.stringify(S)))); }catch(e){ return JSON.stringify(S); } }
function decodeSave(raw){
  let d=null;
  try{ d=JSON.parse(decodeURIComponent(escape(atob(raw)))); }
  catch(e){ try{ d=JSON.parse(raw); }catch(e2){ d=null; } }
  return (d&&typeof d.day==="number")?d:null;
}

/* on open: pick the company back up exactly where it stood */
function tryResume(){
  const raw=STORE.read(); if(!raw) return false;
  const d=decodeSave(raw)||(()=>{ try{ const x=JSON.parse(raw); return typeof x.day==="number"?x:null; }catch(e){ return null; } })();
  if(!d) return false;
  const when=d.savedAt?Math.round((Date.now()-d.savedAt)/60000):null;
  showModal({eyebrow:"WELCOME BACK",title:"Day "+d.day+" is waiting",
    body:"<table class='rows'>"+
      "<tr><td>Cash</td><td>"+money(d.cash)+"</td></tr>"+
      "<tr><td>People on the books</td><td>"+(d.staff?d.staff.length:0)+"</td></tr>"+
      "<tr><td>Market share</td><td>"+((d.share||0)*100).toFixed(1)+"%</td></tr>"+
      "<tr><td>Status</td><td>"+(d.public?"public":"private")+"</td></tr>"+
      "<tr class='tot'><td>Quarter</td><td>"+d.quarter+"</td></tr></table>"+
      "<p>"+(when===null?"Saved on this device.":when<1?"Saved less than a minute ago.":when<60?"Saved "+when+" minutes ago.":"Saved "+Math.round(when/60)+" hours ago.")+
      " It'll start paused.</p>",
    options:[
      {label:"Pick up where you left off",detail:"day "+d.day+", quarter "+d.quarter,run:()=>{
        S=d; S.speed=0; S.over=false; say("Back on day "+S.day+". Paused — hit play when you're ready.","big"); render(); }},
      {label:"Start a new company",detail:"this wipes the saved game",run:()=>{
        STORE.clear(); newGame(); render(); helpModal(); }}
    ]});
  return true;
}

/* manual code: only needed to move between devices */
function doSave(){
  showModal({eyebrow:"MOVE IT",title:"Save code",
    body:"<p>"+(STORE.ok?"Your game already saves to this device on its own — you don't need this. Use it only to carry the company to another phone or browser.":
      "This browser won't let the game save on its own, so this code is your save. Copy it somewhere safe.")+"</p>"+
      "<textarea id='codebox' spellcheck='false' style='width:100%;height:120px;font-family:var(--mono);font-size:11px;padding:9px;border:1px solid var(--paper-2);background:#F6F2E7;color:var(--ink);border-radius:8px'>"+encodeSave()+"</textarea>",
    options:[{label:"Done",detail:"",run:()=>closeModal()}]});
  setTimeout(()=>{const t=document.getElementById("codebox"); if(t){t.focus();t.select();}},40);
}
function doLoad(){
  showModal({eyebrow:"BRING IT OVER",title:"Paste a save code",
    body:"<p>Drop in a code from another device. It replaces the company you're running now.</p>"+
      "<textarea id='codebox' spellcheck='false' placeholder='paste here' style='width:100%;height:120px;font-family:var(--mono);font-size:11px;padding:9px;border:1px solid var(--paper-2);background:#F6F2E7;color:var(--ink);border-radius:8px'></textarea>",
    options:[
      {label:"Load it",detail:"resumes paused",run:()=>{
        const t=document.getElementById("codebox"), raw=(t&&t.value||"").trim();
        if(!raw){ say("Nothing pasted.","bad"); render(); return; }
        const d=decodeSave(raw);
        if(!d){ say("That code didn't read as a save.","bad"); render(); return; }
        S=d; S.speed=0; S.over=false; autosave(true);
        say("Loaded day "+S.day+", quarter "+S.quarter+". Paused.","big"); render(); }},
      {label:"Never mind",detail:"",run:()=>closeModal()}]});
  setTimeout(()=>{const t=document.getElementById("codebox"); if(t) t.focus();},40);
}
function wipeSave(){
  showModal({eyebrow:"START OVER",title:"Delete the saved game",
    body:"<p>This clears the company stored on this device and starts a new one on day 1. There's no undo.</p>",
    options:[
      {label:"Delete it and start fresh",detail:"day 1, $15,000, a bench",run:()=>{ STORE.clear(); newGame(); render(); }},
      {label:"Keep it",detail:"",run:()=>closeModal()}]});
}

/* save on every natural pause: backgrounding, closing, switching apps */
if(typeof window!=="undefined"&&window.addEventListener){
  window.addEventListener("pagehide",()=>autosave(true));
  window.addEventListener("beforeunload",()=>autosave(true));
}
if(typeof document!=="undefined"&&document.addEventListener)
  document.addEventListener("visibilitychange",()=>{ if(document.hidden) autosave(true); });

/* ── boot ──────────────────────────────────────── */
// show the saved company's numbers behind the welcome-back sheet, not day 1's
function paintPreview(){
  const raw=STORE.read(); if(!raw) return;
  const d=decodeSave(raw); if(!d) return;
  const keep=S; S=d; try{ paint(); }catch(e){} S=keep;
}
document.getElementById("slots").innerHTML=
  Array.from({length:HOURS},()=>"<div class='slot'><i></i></div>").join("");
newGame(); render();
if(!tryResume()) helpModal(); else paintPreview();
lastReal=performance.now();
setInterval(loop,200);
setInterval(()=>autosave(),15000);
</script>
</body>
</html>
