<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0F212C">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>SHIFTWORK — run the floor, answer to the board</title>
<style>
:root{
  --ground:#0F212C; --ground-2:#16303F; --ground-3:#122835;
  --paper:#EDE7D6; --paper-2:#DCD4BE;
  --ink:#101B22; --ink-soft:#4A5A63;
  --stamp:#C63F2E; --ok:#2C7A5A; --carbon:#3D4EA8; --amber:#D9A441; --violet:#B15FA8; --cyan:#4FB3C4;
  --line:#2A4757;
  --display:'Haettenschweiler','Arial Narrow','Helvetica Neue',Impact,system-ui,sans-serif;
  --body:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  --nav:calc(62px + env(safe-area-inset-bottom));
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;overscroll-behavior:none}
body{
  background:var(--ground);color:var(--paper);font-family:var(--body);
  font-size:15px;line-height:1.42;-webkit-font-smoothing:antialiased;
  -webkit-text-size-adjust:100%;
}
button{font:inherit;border:none;background:none;color:inherit;cursor:pointer;
  -webkit-user-select:none;user-select:none;touch-action:manipulation}
button:active{filter:brightness(1.25)}
button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

/* ── sticky top: the time card, squeezed for a thumb ── */
.top{position:sticky;top:0;z-index:20;background:var(--ground);
  padding:calc(6px + env(safe-area-inset-top)) 12px 8px;border-bottom:1px solid var(--line)}
.topline{display:flex;align-items:center;gap:10px}
.clock{font-family:var(--mono);font-size:26px;font-weight:600;line-height:1;letter-spacing:-.02em}
.day{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;color:#7E97A6;margin-top:3px;white-space:nowrap}
.cash{margin-left:auto;text-align:right}
.cash b{display:block;font-family:var(--mono);font-size:20px;font-weight:600;line-height:1}
.cash u{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.12em;color:#7E97A6;text-decoration:none;margin-top:3px}
.cash b.neg{color:var(--stamp)}
.tctl{display:flex;gap:6px;margin-left:4px}
.tctl button{width:46px;height:46px;border:1px solid var(--line);border-radius:10px;
  font-family:var(--mono);font-size:13px;font-weight:600;color:#A9BECA;display:grid;place-items:center}
.tctl button.on{background:var(--amber);color:var(--ink);border-color:var(--amber)}

.slots{display:flex;gap:2px;margin:8px 0 7px}
.slot{flex:1;height:12px;background:#0B1A23;position:relative;overflow:hidden;border-radius:2px}
.slot i{position:absolute;inset:0;background:var(--carbon);width:0;display:block;transition:width .2s linear}
.slot.done{background:var(--carbon)}

.ledger{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -12px;padding:0 12px 2px}
.ledger::-webkit-scrollbar{display:none}
.cell{flex:0 0 auto;background:var(--paper);color:var(--ink);border-radius:6px;padding:5px 9px;min-width:76px}
.cell u{display:block;font-family:var(--mono);font-size:8.5px;letter-spacing:.1em;color:var(--ink-soft);text-decoration:none;text-transform:uppercase;white-space:nowrap}
.cell b{display:block;font-family:var(--mono);font-size:14px;font-weight:600;margin-top:1px;white-space:nowrap}
.cell b.neg{color:var(--stamp)} .cell b.pos{color:var(--ok)}

/* ── content ── */
.panel{padding:14px 12px calc(var(--nav) + 18px);min-height:60vh}
h3.sec{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;color:#7E97A6;text-transform:uppercase;
  margin:0 0 9px;font-weight:400}
h3.sec:not(:first-child){margin-top:24px}
.hint{font-size:13px;color:#8FA6B3;margin:6px 0 0}
.empty{font-size:13.5px;color:#8FA6B3;font-style:italic;padding:14px 0}

.row{background:var(--ground-3);border:1px solid var(--line);border-left:3px solid var(--carbon);
  padding:11px 12px;margin-bottom:8px;border-radius:8px}
.row.sales{border-left-color:var(--amber)} .row.mkt{border-left-color:var(--violet)}
.row.support{border-left-color:var(--ok)} .row.ops{border-left-color:var(--stamp)}
.row.rnd{border-left-color:var(--cyan)} .row.flat{border-left-color:var(--line)}
.nm{font-weight:600;font-size:15.5px}
.meta{font-family:var(--mono);font-size:11px;color:#8FA6B3;margin-top:4px;line-height:1.5}
.role{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#8FA6B3}
.acts{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.acts .btn{flex:1 1 auto;min-width:92px}
.btn{min-height:44px;padding:0 14px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:12px;font-weight:600;background:var(--paper);color:var(--ink);text-align:center}
.btn.alt{background:transparent;border:1px solid var(--line);color:#A9BECA}
.btn.go{background:var(--amber);color:var(--ink)}
.btn:disabled{opacity:.3}
.bar{height:6px;background:#0B1A23;border-radius:4px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--ok);transition:width .3s}
.bar i.warn{background:var(--amber)} .bar i.bad{background:var(--stamp)} .bar i.blue{background:var(--carbon)}

.build{display:flex;flex-direction:column;gap:8px}
.item{background:var(--ground-3);border:1px solid var(--line);border-radius:8px;padding:12px}
.item h4{margin:0;font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:.04em;text-transform:uppercase}
.item .lvl{font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--amber);margin-top:3px}
.item p{margin:8px 0 0;font-size:13px;color:#A9BECA;line-height:1.45}
.item .buy{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:11px}
.item .buy .btn{flex:0 0 auto;min-width:104px}
.price{font-family:var(--mono);font-size:15px;font-weight:600}

.stack{display:flex;height:22px;border-radius:4px;overflow:hidden;margin-top:8px;background:#0B1A23}
.stack span{display:block;font-family:var(--mono);font-size:9px;line-height:22px;text-align:center;
  overflow:hidden;white-space:nowrap;color:#0F212C;font-weight:600}
.you{background:var(--amber)} .r0{background:var(--carbon)} .r1{background:var(--cyan)} .r2{background:var(--violet)}
.key{display:flex;gap:12px;flex-wrap:wrap;font-family:var(--mono);font-size:10.5px;color:#8FA6B3;margin-top:9px}
.key i{width:10px;height:10px;display:inline-block;margin-right:5px;border-radius:2px}
.gauge{display:grid;grid-template-columns:62px 1fr 58px;gap:9px;align-items:center;margin-bottom:8px;
  font-family:var(--mono);font-size:11px;color:#A9BECA}
.gauge .bar{margin-top:0}
.gauge span:last-child{text-align:right}

.jobs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.jobs .btn{width:100%}
.pricebox{background:var(--ground-3);border:1px solid var(--line);padding:13px;border-radius:8px;margin-bottom:14px}
.pricebox .val{font-family:var(--mono);font-size:30px;font-weight:600;line-height:1}
input[type=range]{width:100%;accent-color:var(--amber);height:34px;margin:6px 0 0}
textarea{font-size:16px}

.entry{font-family:var(--mono);font-size:11.5px;line-height:1.5;padding:8px 0;border-bottom:1px dotted #23404F;
  color:#A9BECA;display:flex;gap:9px}
.entry time{color:#5C7787;flex-shrink:0}
.entry.cash{color:#7FD1AC} .entry.bad{color:#E88472} .entry.big{color:var(--amber)}

/* ── bottom tab bar ── */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;gap:0;overflow-x:auto;scrollbar-width:none;
  background:rgba(15,33,44,.97);border-top:1px solid var(--line);
  padding:0 4px env(safe-area-inset-bottom);backdrop-filter:blur(10px)}
.nav::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;min-width:74px;height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.09em;text-transform:uppercase;color:#6E8797;
  border-top:2px solid transparent;position:relative}
.tab.on{color:var(--paper);border-top-color:var(--amber)}
.tab em{font-style:normal;font-family:var(--mono);font-size:9.5px;letter-spacing:.02em;color:#7E97A6}
.tab.on em{color:var(--amber)}
.tab.flag::after{content:"";position:absolute;top:9px;right:14px;width:7px;height:7px;border-radius:50%;background:var(--amber)}

/* ── modal as a bottom sheet ── */
.veil{position:fixed;inset:0;background:rgba(8,18,24,.8);display:flex;align-items:flex-end;justify-content:center;z-index:60}
.veil[hidden]{display:none}
.sheet{background:var(--paper);color:var(--ink);width:100%;max-width:560px;
  border-radius:16px 16px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom));
  max-height:90vh;overflow-y:auto;-webkit-overflow-scrolling:touch;position:relative;
  animation:up .26s cubic-bezier(.2,.8,.3,1)}
@keyframes up{from{transform:translateY(28px);opacity:.4}to{transform:none;opacity:1}}
@media(prefers-reduced-motion:reduce){.sheet{animation:none}.slot i{transition:none}}
.sheet::before{content:"";display:block;width:38px;height:4px;border-radius:2px;background:var(--paper-2);margin:-6px auto 14px}
.sheet .eyebrow{font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;color:var(--ink-soft);text-transform:uppercase}
.sheet h2{font-family:var(--display);font-weight:700;font-size:27px;letter-spacing:.04em;text-transform:uppercase;
  margin:6px 0 11px;line-height:1.08}
.sheet p{margin:0 0 13px;font-size:14.5px;color:#33454F;line-height:1.5}
.opts{display:flex;flex-direction:column;gap:9px;margin-top:4px}
.opt{text-align:left;border:1px solid var(--paper-2);background:#F6F2E7;padding:13px 14px;border-radius:10px;min-height:56px}
.opt:active{background:#E9E3D2}
.opt strong{display:block;font-size:15px;line-height:1.3}
.opt em{font-style:normal;font-family:var(--mono);font-size:11.5px;color:var(--ink-soft)}
.rows{width:100%;border-collapse:collapse;margin-bottom:14px;font-family:var(--mono);font-size:12.5px}
.rows td{padding:6px 0;border-bottom:1px dotted var(--paper-2)}
.rows td:last-child{text-align:right;font-weight:600;white-space:nowrap;padding-left:10px}
.rows tr.tot td{border-bottom:none;border-top:2px solid var(--ink);padding-top:9px;font-size:15px}
.rows td.pos{color:var(--ok)} .rows td.neg{color:var(--stamp)}
.tgt{display:flex;justify-content:space-between;gap:10px;padding:9px 11px;border:1px solid var(--paper-2);
  border-radius:6px;margin-bottom:7px;font-family:var(--mono);font-size:12px}
.tgt.hit{border-left:4px solid var(--ok)} .tgt.miss{border-left:4px solid var(--stamp)}
.stamp{position:absolute;top:16px;right:14px;transform:rotate(-11deg);border:3px solid var(--stamp);color:var(--stamp);
  font-family:var(--display);font-weight:700;font-size:14px;letter-spacing:.11em;padding:3px 8px;opacity:.85;text-transform:uppercase}
.stamp.ok{border-color:var(--ok);color:var(--ok)}
</style>
</head>
<body>
<header class="top">
  <div class="topline">
    <div>
      <div class="clock" id="clock">08:00</div>
      <div class="day" id="dayLbl">DAY 1</div>
    </div>
    <div class="cash"><b id="cashNum">$15,000</b><u id="cashLbl">CASH</u></div>
    <div class="tctl">
      <button id="play" data-act="toggle">▶</button>
      <button id="spd" data-act="cycle">1×</button>
    </div>
  </div>
  <div class="slots" id="slots"></div>
  <div class="ledger" id="ledger"></div>
</header>

<main class="panel" id="panel"></main>
<nav class="nav" id="tabs"></nav>

<div class="veil" id="veil" hidden><div class="sheet" id="sheet"></div></div>

<script>
"use strict";
/* ═══════════════════════════════════════════════════════════════
   SHIFTWORK
   Operations run in real time: 1 real minute = 1 worked hour,
   08:00–18:00, so a business day is 10 real minutes.
   Strategy runs on a quarter: 4 days, then the board reviews you.
   ═══════════════════════════════════════════════════════════════ */

const OPEN=8, CLOSE=18, HOURS=CLOSE-OPEN, QDAYS=4, REF=40, BASE_MAT=9;

const ROLES = {
  eng:     {label:"Builder",  blurb:"turns hours into finished units",        base:52},
  sales:   {label:"Closer",   blurb:"moves units out the door",               base:46},
  mkt:     {label:"Marketer", blurb:"builds brand, hour by hour",             base:50},
  support: {label:"Support",  blurb:"keeps brand from bleeding out",          base:38},
  rnd:     {label:"Designer", blurb:"makes long-range projects finish sooner",base:64},
  ops:     {label:"Manager",  blurb:"assign to a department and it lifts",    base:78}
};

/* Segments weight price / quality / brand differently.
   Your single price + quality + brand decide which segments you win. */
const SEGS = [
  {id:"budget",name:"Budget",     a:2.5,b:0.5,c:0.35},
  {id:"main",  name:"Mainstream", a:1.4,b:1.1,c:0.80},
  {id:"prem",  name:"Premium",    a:0.5,b:1.9,c:1.30}
];
const REGIONS = [
  {id:"home", name:"Home market", mix:[.30,.50,.20], ship:0, growth:.005},
  {id:"north",name:"North",       mix:[.25,.45,.30], ship:4, growth:.008},
  {id:"sea",  name:"Overseas",    mix:[.50,.38,.12], ship:9, growth:.012}
];

const BUILDS = [
  {id:"office",name:"Bigger Space",max:3,cost:l=>[15000,54000,172000][l],capex:true,
   desc:l=>["Move out of the garage. Room for 7.","Take the whole floor. Room for 14.","Buy the building. Room for 28."][l]||"",
   after:l=>["Garage · 3 desks","Office · 7 desks","Whole floor · 14 desks","The building · 28 desks"][l]},
  {id:"bench",name:"Better Tools",max:5,cost:l=>Math.round(4400*Math.pow(1.75,l)),capex:true,
   desc:()=>"Every builder makes 18% more units an hour.",after:l=>"+"+(18*l)+"% build rate"},
  {id:"crm",name:"Sales System",max:5,cost:l=>Math.round(4000*Math.pow(1.75,l)),capex:true,
   desc:()=>"Every closer handles 18% more customers an hour.",after:l=>"+"+(18*l)+"% sell rate"},
  {id:"logi",name:"Logistics",max:3,cost:l=>Math.round(9000*Math.pow(1.8,l)),capex:true,
   desc:()=>"Cuts shipping cost per unit outside your home market by 30%.",after:l=>"-"+(30*l)+"% shipping"},
  {id:"brk",name:"Treat People Well",max:3,cost:l=>Math.round(6200*Math.pow(1.9,l)),capex:false,
   desc:()=>"Real breaks, decent coffee, sane hours. Morale recovers faster every night.",after:l=>"+"+(4*l)+" morale/night"}
];

/* Long-range bets: you pay daily, they land days later. */
const PROJECTS = [
  {kind:"quality",name:"Quality program",days:4,max:5,cost:l=>Math.round(17000*Math.pow(1.8,l)),
   desc:"Lands +1.4 product quality. Quality is how you win Premium and charge more."},
  {kind:"brand",name:"Brand campaign",days:3,max:12,cost:l=>Math.round(11000*Math.pow(1.4,l)),
   desc:"Lands +16 brand. Brand slides about a point a day if you stop feeding it."},
  {kind:"lean",name:"Lean the line",days:5,max:3,cost:l=>Math.round(23000*Math.pow(2,l)),
   desc:"Cuts what each unit costs you to make by 14%. Pure margin, forever."},
  {kind:"cap",name:"New production cell",days:3,max:8,cost:l=>Math.round(26000*Math.pow(1.5,l)),
   desc:"Adds 6 units/hour of machine output that never asks for a raise. $260/day upkeep."},
  {kind:"north",name:"Enter the North market",days:3,max:1,cost:()=>62000,
   desc:"Opens a market half again the size of home, tilted to Mainstream and Premium. $4/unit shipping."},
  {kind:"sea",name:"Enter Overseas",days:5,max:1,cost:()=>175000,
   desc:"The biggest market and the most price-driven. $9/unit shipping, and the rivals are already there."}
];

const CAP=[3,7,14,28], RENT=[240,950,2700,6600];

/* Things you can buy that already exist — and sell again when you need cash.
   Effects are keyed by kind so a save code stays plain data. */
const BIZ=["Halvorsen","Ridgeway","Cortez","Ferro","Okada","Blackwell","Maren","Solvang","Petrakis","Quill","Ashgrove","Tiber"];
const SUFFIX=["& Sons","Works","Supply","Group","Partners","Trading","Brothers","Industrial"];
const DEALKINDS=[
  {kind:"supplier",tag:"Parts supplier",upkeep:380,price:()=>Math.round(30000*(1+S.lean*.7)),
   blurb:"Owning your supplier cuts what every unit costs to build by 14%.",
   gate:()=>S.lean<3, apply:()=>S.lean++, undo:()=>S.lean=Math.max(0,S.lean-1)},
  {kind:"haulier",tag:"Freight company",upkeep:320,price:()=>Math.round(25000*(1+S.lv.logi*.8)),
   blurb:"Cuts shipping cost outside your home market by 30%.",
   gate:()=>S.lv.logi<3, apply:()=>S.lv.logi++, undo:()=>S.lv.logi=Math.max(0,S.lv.logi-1)},
  {kind:"studio",tag:"Design studio",upkeep:520,price:()=>48000,
   blurb:"A team with a portfolio. Product quality jumps 0.8 the day the deal closes.",
   gate:()=>S.qual<9.2, apply:()=>S.qual=Math.min(10,S.qual+.8), undo:()=>S.qual=Math.max(1,S.qual-.8)},
  {kind:"shops",tag:"Retail chain",upkeep:640,price:()=>Math.round(40000*(1+S.lv.crm*.5)),
   blurb:"Shelves you control. Your closers handle 18% more customers an hour.",
   gate:()=>S.lv.crm<5, apply:()=>S.lv.crm++, undo:()=>S.lv.crm=Math.max(0,S.lv.crm-1)},
  {kind:"workshop",tag:"Machine shop",upkeep:700,price:()=>Math.round(44000*(1+S.cells*.35)),
   blurb:"A working line with machines already bolted down. +6 units an hour.",
   gate:()=>S.cells<8, apply:()=>S.cells++, undo:()=>S.cells=Math.max(0,S.cells-1)},
  {kind:"agency",tag:"Ad agency",upkeep:460,price:()=>28000,
   blurb:"Brings its own client list and reputation. +14 brand at close.",
   gate:()=>S.brand<86, apply:()=>S.brand=clamp(S.brand+14,1,100), undo:()=>S.brand=clamp(S.brand-14,1,100)},
  {kind:"dist_north",tag:"Northern distributor",upkeep:540,price:()=>95000,
   blurb:"Opens the North market the moment you sign — no three-day entry project.",
   gate:()=>!S.regions.north, apply:()=>S.regions.north=true, undo:()=>S.regions.north=false},
  {kind:"dist_sea",tag:"Overseas distributor",upkeep:980,price:()=>235000,
   blurb:"Opens Overseas immediately, with the shipping already arranged.",
   gate:()=>!S.regions.sea, apply:()=>S.regions.sea=true, undo:()=>S.regions.sea=false}
];
const dealKind=k=>DEALKINDS.find(d=>d.kind===k);
const DEPTS=[
  {id:"prod", name:"Production",      roles:["eng"],           note:"units built per hour"},
  {id:"sales",name:"Sales",           roles:["sales"],         note:"units moved per hour"},
  {id:"brand",name:"Brand & support", roles:["mkt","support"], note:"how fast brand climbs"},
  {id:"rnd",  name:"Design",          roles:["rnd"],           note:"how fast projects finish"}
];
const OWNER_JOBS=[
  {id:"build", label:"On the line", note:"you add 5 units/hour on top of the shop floor"},
  {id:"sell",  label:"Selling",     note:"you add 6 units/hour of selling capacity"},
  {id:"market",label:"Out front",   note:"you push brand up much faster"},
  {id:"manage",label:"Managing",    note:"+8% to every department, but you're off the tools"}
];
let S, tab="floor", modalOpen=false, modalOpts=[], lastReal=0;

/* ── setup ─────────────────────────────────────── */
const FIRST=["Rosa","Dev","Marcus","Jun","Priya","Tomas","Nadia","Eli","Claire","Omar","Val","Hana","Bo","Ingrid","Casey","Yusuf","Lena","Ray","Mei","Ade","Sofia","Nils","Kwame","Ida","Theo","Rina"];
const LAST=["Alvarez","Okonkwo","Bell","Nakamura","Rao","Vasquez","Haddad","Fischer","Moreau","Sy","Kaminski","Torres","Lindqvist","Owusu","Brennan","Duarte","Novak","Park","Mensah","Castellanos"];
const pick=a=>a[Math.floor(Math.random()*a.length)];
const money=n=>(n<0?"-$":"$")+Math.abs(Math.round(n)).toLocaleString();
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const pad=n=>String(Math.floor(n)).padStart(2,"0");

function newGame(){
  S={ cash:15000, day:1, hour:OPEN, min:0, speed:1,
      owner:{focus:"build"}, public:false, profitQ:0, credit:25000, ipoDay:0, lastSpeed:1,
      price:30, qual:5, brand:50, inv:8, lean:0, cells:0,
      staff:[], pool:[], lv:{office:0,bench:0,crm:0,logi:0,brk:0}, plv:{}, jobs:[],
      regions:{home:true,north:false,sea:false}, mkt:{home:16,north:22,sea:34},
      rivals:[
        {name:"Delta Standard",mode:"cost",   price:27,qual:4.0,brand:41,in:{home:1,north:1,sea:1}},
        {name:"Northline",     mode:"volume", price:43,qual:6.0,brand:52,in:{home:1,north:1,sea:0}},
        {name:"Auriga Works",  mode:"premium",price:84,qual:8.2,brand:64,in:{home:1,north:0,sea:1}}
      ],
      loan:0, equity:15000, plant:0, shares:1000, stock:0, rating:"A", subs:[], deals:[],
      accrued:0, dayRev:0, dayUnits:0, dayLost:0, dayBuilt:0, share:0,
      acct:{rev:0,cogs:0,opex:0,int:0,dep:0,units:0},
      quarter:1, strikes:0, lastEPS:0, epsHist:[], targets:null,
      log:[], eventAt:3, over:false, won:false };
  PROJECTS.forEach(p=>S.plv[p.kind]=0);
  S.targets=null;
  refreshPool(true); rollDeals();
  say("Day 1. It's just you, eight units in the back, and three rivals already selling.","big");
}
function person(role,skill,wage){
  return {id:Math.random().toString(36).slice(2,9),name:pick(FIRST)+" "+pick(LAST),role,skill,dept:null,
    wage:wage||Math.round(ROLES[role].base*(0.60+skill*0.20)/5)*5,
    morale:70+Math.floor(Math.random()*16),days:0};
}
function refreshPool(silent){
  const keys=Object.keys(ROLES); S.pool=[];
  for(let i=0;i<4;i++) S.pool.push(person(keys[Math.floor(Math.random()*keys.length)],1+Math.floor(Math.random()*5)));
  if(!silent) say("Four new people applied.","");
}

function rollDeals(){
  const open=DEALKINDS.filter(k=>k.gate()&&!S.deals.some(d=>d.kind===k.kind));
  S.deals=S.deals.filter(d=>dealKind(d.kind).gate());
  while(S.deals.length<3&&open.length){
    const k=open.splice(Math.floor(Math.random()*open.length),1)[0];
    S.deals.push({id:Math.random().toString(36).slice(2,8),kind:k.kind,
      name:pick(BIZ)+" "+pick(SUFFIX),price:k.price(),upkeep:k.upkeep});
  }
}
function rivalValue(r){
  let rev=0;
  REGIONS.forEach(reg=>{ if(!r.in[reg.id]) return;
    SEGS.forEach((sg,i)=>{
      const dem=S.mkt[reg.id]*reg.mix[i];
      const all=S.rivals.filter(x=>x.in[reg.id]).reduce((a,x)=>a+attract(x.price,x.qual,x.brand,sg),0)
        +(S.regions[reg.id]?attract(S.price,S.qual,S.brand,sg):0);
      rev+=dem*attract(r.price,r.qual,r.brand,sg)/(all||1)*r.price; }); });
  return Math.round(Math.max(140000,rev*HOURS*26));
}
const subsUpkeep=()=>S.subs.reduce((a,x)=>a+x.upkeep,0);
const subsValue=()=>S.subs.reduce((a,x)=>a+x.paid*.6,0);

/* ── money plumbing (so the P&L is real) ───────── */
function earn(n){ S.cash+=n; S.acct.rev+=n; }
function pay(n,kind){ S.cash-=n; if(kind==="capex"){S.plant+=n;} else {S.acct[kind]=(S.acct[kind]||0)+n;} }

/* ── derived ───────────────────────────────────── */
const of=r=>S.staff.filter(p=>p.role===r);
const moraleAvg=()=>S.staff.length?S.staff.reduce((a,p)=>a+p.morale,0)/S.staff.length:70;
const moraleMult=()=>0.55+moraleAvg()/150;
const ownerOn=f=>S.owner.focus===f;
const deptHead=d=>S.staff.filter(p=>p.role==="ops"&&p.dept===d).sort((a,b)=>b.skill-a.skill)[0]||null;
const deptMult=d=>{ const m=deptHead(d);
  const floating=S.staff.filter(p=>p.role==="ops"&&!p.dept).reduce((a,p)=>a+p.skill*.012,0);
  return 1+(m?m.skill*.06:0)+floating+(ownerOn("manage")?.08:0); };
const capacity=()=>CAP[S.lv.office];
const payrollDay=()=>S.staff.reduce((a,p)=>a+p.wage,0)*HOURS;
const jobDaily=()=>S.jobs.reduce((a,j)=>a+j.daily,0);
const upkeepDay=()=>RENT[S.lv.office]+S.cells*260+subsUpkeep();
const buildRate=()=>(of("eng").reduce((a,p)=>a+p.skill*2.2,0)+2+(ownerOn("build")?5:0))*(1+.18*S.lv.bench)*moraleMult()*deptMult("prod")+S.cells*6;
const sellRate=()=>(of("sales").reduce((a,p)=>a+p.skill*3,0)+2+(ownerOn("sell")?6:0))*(1+.18*S.lv.crm)*moraleMult()*deptMult("sales");
const attract=(pr,q,br,sg)=>Math.pow(REF/Math.max(3,pr),sg.a)*Math.pow(Math.max(.5,q)/5,sg.b)*Math.pow(Math.max(5,br)/50,sg.c);
const netWorth=()=>S.cash+S.plant+S.inv*matCost()+subsValue()-S.loan;
const marketCap=()=>S.stock*S.shares;
const matCost=()=>BASE_MAT*(1-.14*S.lean);
const unitCost=()=>matCost()+shipAvg();

function market(){
  let mine=0,total=0,cells=[];
  REGIONS.forEach(r=>{
    SEGS.forEach((sg,i)=>{
      const dem=S.mkt[r.id]*r.mix[i]; total+=dem;
      const rv=S.rivals.filter(x=>x.in[r.id]).map(x=>attract(x.price,x.qual,x.brand,sg));
      const rvSum=rv.reduce((a,b)=>a+b,0);
      const open=S.regions[r.id];
      const me=open?attract(S.price,S.qual,S.brand,sg):0;
      const sh=me/(me+rvSum||1);
      if(open) mine+=dem*sh;
      cells.push({r,sg,dem,sh,rv,rvSum,me,open});
    });
  });
  return {mine,total,cells};
}
function shipAvg(){
  let w=0,tot=0;
  REGIONS.forEach(r=>{ if(!S.regions[r.id]) return;
    const d=S.mkt[r.id]; w+=d*r.ship*(1-.30*S.lv.logi); tot+=d; });
  return tot?w/tot:0;
}

/* ── the clock ─────────────────────────────────── */
function loop(){
  const now=performance.now(), dt=Math.min(400,now-lastReal); lastReal=now;
  if(S.over||modalOpen||S.speed===0){ paint(); return; }
  const mins=(dt/1000)*S.speed;
  S.min+=mins; runMinutes(mins);
  while(S.min>=60){
    S.min-=60; S.hour++;
    if(S.hour>=CLOSE){ endOfDay(); return; }
    onHour();
  }
  paint();
}

function runMinutes(m){
  const f=m/60, M=market();
  const built=buildRate()*f; S.inv+=built;
  pay(built*matCost(),"cogs");
  S.dayBuilt=(S.dayBuilt||0)+built;
  const want=M.mine*f;
  const sold=Math.min(S.inv,sellRate()*f,want);
  S.inv-=sold; S.dayUnits+=sold; S.acct.units+=sold;
  earn(sold*S.price);
  S.dayRev+=sold*S.price;
  pay(sold*shipAvg(),"cogs");
  const lost=want-sold;
  if(lost>0){ S.dayLost+=lost; S.brand=clamp(S.brand-lost*0.02*f,1,100); }
  S.accrued+=S.staff.reduce((a,p)=>a+p.wage,0)*f;
  S.share=M.total?M.mine/M.total:0;

  // brand moves hourly: marketers push, support holds the floor, entropy pulls
  const push=(of("mkt").reduce((a,p)=>a+p.skill*.05,0)+.05+(ownerOn("market")?.25:0))*deptMult("brand");
  const hold=of("support").reduce((a,p)=>a+p.skill*.03,0);
  S.brand=clamp(S.brand+(push+hold-0.10)*f,1,100);
}
function onHour(){
  if(S.hour===12) say("Lunch. The line keeps moving.","");
  if(--S.eventAt<=0&&!S.over){ S.eventAt=3+Math.floor(Math.random()*4); fireEvent(); }
}

/* ── close of day ──────────────────────────────── */
function endOfDay(){
  const payroll=Math.round(payrollDay()), up=Math.round(upkeepDay()), jobs=Math.round(jobDaily());
  const rate={A:.006,B:.010,C:.017,D:.026}[S.rating];
  const interest=Math.round(S.loan*rate);
  S.loan+=interest; S.acct.int+=interest;
  pay(up,"opex"); if(jobs) pay(jobs,"opex");
  S.jobs.forEach(j=>j.spent+=j.daily);

  const short=S.cash<payroll;
  const body="<table class='rows'>"+
    "<tr><td>Sold · "+Math.round(S.dayUnits)+" units at "+money(S.price)+"</td><td class='pos'>"+money(S.dayRev)+"</td></tr>"+
    "<tr><td>Materials · "+Math.round(S.dayBuilt||0)+" units built at "+money(matCost())+"</td><td>-"+money((S.dayBuilt||0)*matCost())+"</td></tr>"+(shipAvg()>0?"<tr><td>Shipping</td><td>-"+money(S.dayUnits*shipAvg())+"</td></tr>":"")+
    (S.dayLost>1?"<tr><td>Buyers you couldn't serve</td><td class='neg'>"+Math.round(S.dayLost)+" units</td></tr>":"")+
    "<tr><td>Rent &amp; machine upkeep</td><td>-"+money(up)+"</td></tr>"+
    (jobs?"<tr><td>Projects in progress · "+S.jobs.length+"</td><td>-"+money(jobs)+"</td></tr>":"")+
    (interest?"<tr><td>Interest · rating "+S.rating+"</td><td>-"+money(interest)+"</td></tr>":"")+
    "<tr><td>Payroll · "+S.staff.length+" × "+HOURS+"h</td><td>-"+money(payroll)+"</td></tr>"+
    "<tr class='tot'><td>Day "+S.day+"</td><td>"+money(S.dayRev-(S.dayBuilt||0)*matCost()-S.dayUnits*shipAvg()-up-jobs-interest-payroll)+"</td></tr></table>"+
    "<p>Cash before payroll: <b>"+money(S.cash)+"</b>."+(short?" <b style='color:var(--stamp)'>You can't cover it.</b>":"")+"</p>";

  const o=[];
  if(!short){
    o.push({label:"Pay everyone",detail:"-"+money(payroll)+" · morale holds",run:()=>settle(payroll,true)});
    if(S.cash-payroll>3000&&S.staff.length){
      const b=Math.round(payroll*.25);
      o.push({label:"Pay everyone, plus a bonus",detail:"-"+money(payroll+b)+" · +9 morale each",run:()=>{
        settle(payroll,true); pay(b,"opex"); S.staff.forEach(p=>p.morale=clamp(p.morale+9,0,100));
        say("Paid out "+money(b)+" in bonuses. People noticed.","cash"); }});
    }
    if(S.loan>0&&S.cash>S.loan+payroll)
      o.push({label:"Pay everyone and clear the debt",detail:"-"+money(payroll+S.loan)+" · rating improves",run:()=>{
        settle(payroll,true); S.cash-=S.loan; say("Cleared "+money(S.loan)+" of debt.","cash"); S.loan=0; }});
  }else{
    const room=Math.max(0,S.credit-S.loan), amt=Math.min(room,Math.max(12000,Math.round(payroll*2)));
    if(S.cash+amt>=payroll) o.push({label:"Draw on the credit line",detail:"+"+money(amt)+" debt at "+(rate*100).toFixed(1)+"%/day · "+money(room)+" left",run:()=>{
      S.loan+=amt; S.cash+=amt; say("Drew "+money(amt)+" on the credit line.","bad"); settle(payroll,true); }});
    o.push({label:"Skip payroll",detail:"-28 morale each · people may walk",run:()=>{
      S.staff.forEach(p=>p.morale=clamp(p.morale-28,0,100));
      say("Payroll missed. Nobody said much, which is worse.","bad"); settle(0,false); }});
    if(S.jobs.length) o.push({label:"Cancel a project and pay people",detail:"lose what you've spent on it",run:()=>{
      const j=S.jobs.pop(); say("Cancelled "+j.name.toLowerCase()+". "+money(j.spent)+" gone.","bad");
      settle(Math.min(payroll,Math.max(0,S.cash)),true); }});
    if(S.staff.length>1){
      const top=S.staff.slice().sort((a,b)=>b.wage-a.wage)[0];
      o.push({label:"Let "+top.name.split(" ")[0]+" go, then pay the rest",detail:"severance "+money(top.wage*16),run:()=>{
        pay(top.wage*16,"opex"); S.staff=S.staff.filter(p=>p.id!==top.id);
        S.staff.forEach(p=>p.morale=clamp(p.morale-10,0,100));
        say(top.name+" was laid off.","bad"); settle(Math.round(payrollDay()),true); }});
    }
  }
  showModal({eyebrow:"DAY "+S.day+" · CLOSING",title:"Punch out",body,options:o,stamp:short?"SHORT":null});
}

function settle(payroll,paid){
  pay(payroll,"opex");
  S.plant*=0.992; S.acct.dep+=S.plant*0.008;

  // projects advance — designers speed them up
  const speed=(1+of("rnd").reduce((a,p)=>a+p.skill*.09,0))*deptMult("rnd");
  S.jobs.forEach(j=>j.left-=speed);
  const done=S.jobs.filter(j=>j.left<=0);
  S.jobs=S.jobs.filter(j=>j.left>0);
  done.forEach(j=>{
    if(j.kind==="quality"){ S.qual=Math.min(10,S.qual+1.4); say("Quality program landed. Product is now "+S.qual.toFixed(1)+"/10.","big"); }
    if(j.kind==="brand"){ S.brand=clamp(S.brand+16,1,100); say("Brand campaign landed. Brand at "+Math.round(S.brand)+".","big"); }
    if(j.kind==="lean"){ S.lean++; say("Lean program landed. Unit cost down to "+money(unitCost())+".","big"); }
    if(j.kind==="cap"){ S.cells++; say("New production cell online. +6 units/hour.","big"); }
    if(j.kind==="north"){ S.regions.north=true; say("North market is open for business.","big"); }
    if(j.kind==="sea"){ S.regions.sea=true; say("Overseas is open. It's crowded out there.","big"); }
  });

  // people
  S.staff.forEach(p=>{ p.days++;
    p.morale=clamp(p.morale+4*S.lv.brk+(paid?1.5:0)-2.5+(of("ops").length?1.5:0),0,100); });
  const quits=S.staff.filter(p=>p.morale<30&&Math.random()<.22+(30-p.morale)/100);
  quits.forEach(p=>say(p.name+" quit. Cleared out their desk at close.","bad"));
  S.staff=S.staff.filter(p=>!quits.includes(p));

  // brand entropy, market growth, rivals move
  S.brand=clamp(S.brand-1.1,1,100);
  REGIONS.forEach(r=>S.mkt[r.id]*=(1+r.growth));
  rivalsDay();
  rate();

  say("Day "+S.day+" closed · "+money(S.dayRev)+" in · "+(S.share*100).toFixed(1)+"% share","cash");

  const wasQuarter=S.day%QDAYS===0;
  S.day++; S.hour=OPEN; S.min=0;
  S.accrued=0; S.dayRev=0; S.dayUnits=0; S.dayLost=0; S.dayBuilt=0;
  refreshPool(true);

  if(S.cash<-8000){ bust(); return; }
  if(wasQuarter){ quarterEnd(); return; }
  closeModal(); render(); autosave(true);
}

function rate(){
  const de=S.loan/Math.max(1,S.equity);
  S.rating=S.equity<=0?"D":de<.25?"A":de<.7?"B":de<1.4?"C":"D";
}
function rivalsDay(){
  S.rivals.forEach(r=>{
    r.brand=Math.min(96,r.brand+.35);
    r.qual=Math.min(10,r.qual+(r.mode==="premium"?.05:.03));
    if(r.mode==="cost") r.price=Math.max(13,r.price*.997);
    if(r.mode==="volume") r.price=Math.max(19,r.price*(S.share>.25?.984:.998));
    if(r.mode==="premium") r.price*=1.002;
  });
  if(S.day===7){ S.rivals[1].in.sea=1; say("Northline just entered Overseas.",""); }
  if(S.day===12){ S.rivals[2].in.north=1; say("Auriga Works moved into the North market.",""); }
  if(S.share>.34&&Math.random()<.3){
    const r=pick(S.rivals); r.price=Math.max(12,r.price*.9);
    say(r.name+" cut price hard. They've noticed you.","bad");
  }
}

/* ── quarter close · bank first, board after the IPO ── */
function quarterEnd(){
  const A=S.acct, gross=A.rev-A.cogs, op=gross-A.opex-A.dep, pre=op-A.int;
  const tax=pre>0?pre*.25:0, net=pre-tax;
  if(tax) S.cash-=tax;
  S.equity+=net; rate();
  S.profitQ = net>0 ? S.profitQ+1 : 0;
  if(S.public){ S.lastEPS=net/S.shares; S.epsHist.push(S.lastEPS); }
  return S.public ? boardReview(net,pre,gross) : bankReview(net,pre,gross);
}
function pnl(net,pre,gross){
  const A=S.acct;
  return "<table class='rows'>"+
    "<tr><td>Revenue · "+Math.round(A.units)+" units</td><td class='pos'>"+money(A.rev)+"</td></tr>"+
    "<tr><td>Cost of goods</td><td>-"+money(A.cogs)+"</td></tr>"+
    "<tr><td>Gross profit</td><td>"+money(gross)+"</td></tr>"+
    "<tr><td>Operating costs · payroll, rent, projects</td><td>-"+money(A.opex)+"</td></tr>"+
    "<tr><td>Depreciation</td><td>-"+money(A.dep)+"</td></tr>"+
    "<tr><td>Interest</td><td>-"+money(A.int)+"</td></tr>"+
    (pre>0?"<tr><td>Tax</td><td>-"+money(pre*.25)+"</td></tr>":"")+
    "<tr class='tot'><td>"+(S.public?"Net income":"Owner's profit")+"</td><td class='"+(net>=0?"pos":"neg")+"'>"+money(net)+"</td></tr></table>";
}

/* IPO gate — the whole point of the private phase */
const IPO_BAR={equity:120000,profitQ:2,qual:6,share:.07};
function ipoCheck(){
  return [
    {n:"Owner equity",         got:S.equity,      need:IPO_BAR.equity,  f:v=>money(v)},
    {n:"Profitable quarters",  got:S.profitQ,     need:IPO_BAR.profitQ, f:v=>Math.round(v)+" in a row"},
    {n:"Product quality",      got:S.qual,        need:IPO_BAR.qual,    f:v=>v.toFixed(1)+"/10"},
    {n:"Market share",         got:S.share*100,   need:IPO_BAR.share*100,f:v=>v.toFixed(1)+"%"}
  ];
}
const ipoReady=()=>ipoCheck().every(c=>c.got>=c.need);
function valuation(){ return Math.round(Math.max(50000, S.equity*1.4 + Math.max(0,S.lastQnet||0)*4*7 + S.brand*400 + S.share*100*3000 + subsValue())); }

function bankReview(net,pre,gross){
  S.lastQnet=net;
  const before=S.credit;
  S.credit=Math.round(clamp(Math.max(25000,S.equity*(S.rating==="A"?1.1:S.rating==="B"?.8:.5)),25000,600000));
  const checks=ipoCheck(), ready=ipoReady();
  const body=pnl(net,pre,gross)+
    "<p>Owner equity <b>"+money(S.equity)+"</b> · credit line <b>"+money(S.credit)+"</b>"+
    (S.credit>before?" <span style='color:var(--ok)'>(raised)</span>":S.credit<before?" <span style='color:var(--stamp)'>(cut)</span>":"")+
    " · rating <b>"+S.rating+"</b></p>"+
    "<div class='eyebrow' style='margin-bottom:6px'>GOING PUBLIC</div>"+
    checks.map(c=>"<div class='tgt "+(c.got>=c.need?"hit":"miss")+"'><span>"+c.n+"</span><span>"+c.f(c.got)+" of "+c.f(c.need)+"</span></div>").join("")+
    "<p>"+(ready?"You clear every bar. An underwriter has called.":"Keep building. The bank is happy either way — nobody can fire you yet.")+"</p>";
  const o=[{label:"Back to work",detail:"quarter "+(S.quarter+1)+" starts",run:()=>nextQuarter()}];
  if(ready) o.unshift({label:"Take the company public",detail:"valued around "+money(valuation()),run:()=>ipoModal()});
  if(S.loan>0&&S.cash>S.loan) o.push({label:"Clear the debt",detail:"-"+money(S.loan)+" · better rating, cheaper money",run:()=>{
    S.cash-=S.loan; say("Debt retired.","cash"); S.loan=0; rate(); nextQuarter(); }});
  showModal({eyebrow:"QUARTER "+S.quarter+" · THE BOOKS",title:net>=0?"You made money":"You lost money",
    body,options:o,stamp:ready?"IPO READY":null,stampOk:ready});
}

function ipoModal(){
  const val=valuation(), pps=val/S.shares;
  const deal=n=>({shares:n,raise:Math.round(n*pps*.92),pct:Math.round(n/(S.shares+n)*100)});
  const small=deal(250), big=deal(650);
  const go=d=>()=>{
    S.public=true; S.ipoDay=S.day; S.shares+=d.shares; S.cash+=d.raise; S.equity+=d.raise;
    S.stock=Math.max(1,S.equity/S.shares);
    S.strikes=0; S.lastEPS=Math.max(.4,(S.lastQnet||0)/S.shares);
    S.targets={eps:Math.max(.40,S.lastEPS*1.1),share:Math.min(46,S.share*100+2),stock:S.stock*1.12};
    say("You rang the bell. "+money(d.raise)+" raised, "+d.pct+"% of the company sold. The board starts watching now.","big");
    tab="board"; nextQuarter();
  };
  showModal({eyebrow:"UNDERWRITER",title:"Ring the bell",stamp:"OFFER",stampOk:true,
    body:"<p>They value the company at <b>"+money(val)+"</b> — about "+money(pps)+" a share against your "+S.shares.toLocaleString()+" founder shares. How much of it do you want to sell?</p>"+
      "<p>Selling more raises more cash now and gives you room to buy machines, enter markets and outspend the rivals. It also hands more of the company to people who will hold you to a number every four days.</p>",
    options:[
      {label:"Sell a small slice · "+small.pct+"%",detail:"+"+money(small.raise)+" cash · you keep control",run:go(small)},
      {label:"Sell a big slice · "+big.pct+"%",detail:"+"+money(big.raise)+" cash · heavier expectations",run:go(big)},
      {label:"Stay private",detail:"nobody can fire you",run:()=>{ say("Turned the underwriter down. Still yours.",""); nextQuarter(); }}
    ]});
}

function boardReview(net,pre,gross){
  S.lastQnet=net;
  const eps=S.lastEPS;
  const bps=S.equity/S.shares, adj={A:.10,B:0,C:-.10,D:-.25}[S.rating];
  const fair=Math.max(1,bps*(0.9+adj+S.share*1.5)+eps*4*7);
  S.stock=Math.max(.5,S.stock*.35+fair*.65);
  const t=S.targets;
  const hits=[
    {n:"Earnings per share",got:eps,need:t.eps,fmt:v=>"$"+v.toFixed(2),ok:eps>=t.eps},
    {n:"Market share",got:S.share*100,need:t.share,fmt:v=>v.toFixed(1)+"%",ok:S.share*100>=t.share},
    {n:"Share price",got:S.stock,need:t.stock,fmt:v=>"$"+v.toFixed(2),ok:S.stock>=t.stock}
  ];
  const passed=hits.filter(h=>h.ok).length>=2;
  S.strikes=passed?Math.max(0,S.strikes-1):S.strikes+1;
  const body=pnl(net,pre,gross)+
    "<p><b>EPS "+eps.toFixed(2)+"</b> · share price <b>$"+S.stock.toFixed(2)+"</b> · rating <b>"+S.rating+"</b> · market cap <b>"+money(marketCap())+"</b></p>"+
    hits.map(h=>"<div class='tgt "+(h.ok?"hit":"miss")+"'><span>"+h.n+"</span><span>"+h.fmt(h.got)+" vs "+h.fmt(h.need)+"</span></div>").join("")+
    "<p>"+(passed?"The board is satisfied.":"The board is not satisfied. Strike "+S.strikes+" of 3.")+"</p>";
  if(S.strikes>=3){
    S.over=true;
    showModal({eyebrow:"QUARTER "+S.quarter,title:"The board removes you",stamp:"DISMISSED",
      body:body+"<p>Three bad quarters. They thank you for your service — and keep the company.</p>",
      options:[{label:"Start over",detail:"new company, same clock",run:()=>{newGame();render();}}]});
    return;
  }
  if(marketCap()>=4000000&&!S.won){
    S.won=true;
    showModal({eyebrow:"QUARTER "+S.quarter,title:"You made it",stamp:"PAID",stampOk:true,
      body:body+"<p>Market cap crossed "+money(marketCap())+" — from a one-person shop on day 1 to this in "+S.day+" days. Keep going if you want.</p>",
      options:[{label:"Keep going",detail:"the clock starts again",run:()=>nextQuarter()}]});
    return;
  }
  const o=[{label:"Accept the targets",detail:"back to the floor",run:()=>nextQuarter()}];
  if(net>0) o.push({label:"Pay a dividend of "+money(net*.3),detail:"share price +8% · the board warms to you",run:()=>{
    S.cash-=net*.3; S.equity-=net*.3; S.stock*=1.08; S.strikes=Math.max(0,S.strikes-1);
    say("Paid a dividend. The board liked that.","cash"); nextQuarter(); }});
  if(S.stock>3) o.push({label:"Issue 150 shares",detail:"+"+money(150*S.stock*.88)+" cash · dilutes EPS",run:()=>{
    const raise=150*S.stock*.88; S.cash+=raise; S.equity+=raise; S.shares+=150;
    say("Issued 150 shares for "+money(raise)+".","cash"); nextQuarter(); }});
  if(S.loan>0&&S.cash>S.loan) o.push({label:"Retire the debt",detail:"-"+money(S.loan)+" · better rating",run:()=>{
    S.cash-=S.loan; say("Debt retired.","cash"); S.loan=0; rate(); nextQuarter(); }});
  showModal({eyebrow:"QUARTER "+S.quarter+" · BOARD REVIEW",title:passed?"Quarter accepted":"Quarter questioned",
    body,options:o,stamp:passed?"APPROVED":"UNDER REVIEW",stampOk:passed});
}
function nextQuarter(){
  S.quarter++; rollDeals();
  S.acct={rev:0,cogs:0,opex:0,int:0,dep:0,units:0};
  if(S.public){
    S.targets={ eps:S.lastEPS>0?Math.max(.40,S.lastEPS*1.25):.40, share:Math.min(46,S.share*100+2.5), stock:S.stock*1.18 };
    say("Quarter "+S.quarter+" targets: EPS $"+S.targets.eps.toFixed(2)+" · share "+S.targets.share.toFixed(1)+"% · stock $"+S.targets.stock.toFixed(2),"big");
  } else say("Quarter "+S.quarter+" begins.","");
  closeModal(); render();
}
function exitModal(unsolicited,premium){
  const px=S.public?Math.round(marketCap()*(premium||1.1)):Math.round(valuation()*(unsolicited?(premium||1.15):.9));
  const done=()=>{
    S.over=true;
    showModal({eyebrow:"SOLD",title:"You're out",stamp:"SOLD",stampOk:true,
      body:"<p>You sold for <b>"+money(px)+"</b> on day "+S.day+", quarter "+S.quarter+".</p>"+
        "<table class='rows'><tr><td>Days run</td><td>"+S.day+"</td></tr>"+
        "<tr><td>People on the books at the end</td><td>"+S.staff.length+"</td></tr>"+
        "<tr><td>Market share</td><td>"+(S.share*100).toFixed(1)+"%</td></tr>"+
        "<tr><td>Businesses you bought</td><td>"+S.subs.length+"</td></tr>"+
        "<tr><td>Rivals left standing</td><td>"+S.rivals.length+"</td></tr>"+
        "<tr class='tot'><td>Walked away with</td><td class='pos'>"+money(px-S.loan)+"</td></tr></table>"+
        "<p>Started with $15,000 and a bench.</p>",
      options:[{label:"Run it again",detail:"new company, same clock",run:()=>{newGame();render();}}]});
  };
  showModal({eyebrow:unsolicited?"UNSOLICITED OFFER":"THE EXIT",
    title:unsolicited?"Someone wants to buy you":"Sell the company",
    body:"<p>"+(unsolicited?"An offer landed on your desk: <b>"+money(px)+"</b>, cash, clean.":
      "A buyer would pay about <b>"+money(px)+"</b> for what you've built. You'd clear "+money(px-S.loan)+" after the debt.")+"</p>"+
      "<p>Taking it ends the run. There's no coming back to this company.</p>",
    options:[{label:"Take the money",detail:money(px-S.loan)+" in hand",run:done},
             {label:"It's not for sale",detail:"keep running it",run:()=>closeModal()}]});
}

function bust(){
  S.over=true;
  showModal({eyebrow:"DAY "+S.day,title:"Out of money",stamp:"CLOSED",
    body:"<p>Cash bottomed out at "+money(S.cash)+" with "+money(S.loan)+" owed. The doors close on day "+S.day+".</p>",
    options:[{label:"Start over",detail:"new company, same clock",run:()=>{newGame();render();}}]});
}

/* ── events ────────────────────────────────────── */
const EVENTS=[
  ()=>({t:"Rush order",p:"A buyer wants "+(18+Math.floor(Math.random()*20))+" units by tonight, well over list. "+(S.staff.length?"Your people would stay late.":"You'd be on the line past dark."),
   o:[{label:"Take it, work late",detail:"+"+money(2400+S.day*160)+" · -11 morale each",run:()=>{earn(2400+S.day*160);S.staff.forEach(p=>p.morale=clamp(p.morale-11,0,100));say(S.staff.length?"Rush order shipped. Everyone left after dark.":"Rush order shipped. You locked up at midnight.","cash");}},
      {label:"Turn it down",detail:"no change",run:()=>say("Passed on the rush order.","")}]}),
  ()=>({t:"Line trouble",p:"Something is grinding. It gets worse if you leave it.",
   o:[{label:"Fix it now",detail:"-"+money(1900+S.cells*500),run:()=>{pay(1900+S.cells*500,"opex");say("Repairs paid. Line is smooth again.","");}},
      {label:"Run it anyway",detail:"lose most of the afternoon's output",run:()=>{S.inv=Math.max(0,S.inv-buildRate()*3.5);say("Ran it broken. Lost the afternoon's build.","bad");}}]}),
  ()=>{const p=S.staff.length?pick(S.staff):null; if(!p) return null;
   const ask=Math.max(5,Math.round(p.wage*.18/5)*5);
   return {t:"Raise request",p:p.name+" ("+ROLES[p.role].label+", skill "+p.skill+") has been here "+p.days+" days and wants +"+money(ask)+"/hour.",
   o:[{label:"Give the raise",detail:"+"+money(ask*HOURS)+"/day payroll · +16 morale",run:()=>{p.wage+=ask;p.morale=clamp(p.morale+16,0,100);say(p.name+" got a raise.","");}},
      {label:"Say not yet",detail:"-14 morale",run:()=>{p.morale=clamp(p.morale-14,0,100);say(p.name+" took the no quietly.","bad");}},
      {label:"One-time bonus instead",detail:"-"+money(ask*HOURS*3)+" · +8 morale",run:()=>{pay(ask*HOURS*3,"opex");p.morale=clamp(p.morale+8,0,100);say("Paid "+p.name+" a lump sum instead.","");}}]};},
  ()=>({t:"A review lands",p:"Someone with an audience wrote about your product. It's mixed, and it's spreading.",
   o:[{label:"Respond publicly",detail:"+6 brand",run:()=>{S.brand=clamp(S.brand+6,1,100);say("Handled the review well.","");}},
      {label:"Ignore it",detail:"-5 brand",run:()=>{S.brand=clamp(S.brand-5,1,100);say("Let it sit. It didn't help.","bad");}},
      {label:"Buy the top slot to bury it",detail:"-"+money(3000)+" · +9 brand",run:()=>{pay(3000,"opex");S.brand=clamp(S.brand+9,1,100);say("Bought attention.","cash");}}]}),
  ()=>{const r=pick(S.rivals);
   return {t:r.name+" moves",p:r.name+" is selling at "+money(r.price)+" with quality "+r.qual.toFixed(1)+". Their sales team is calling your Mainstream buyers directly.",
   o:[{label:"Undercut them by 10%",detail:"price → "+money(Math.max(6,Math.round(S.price*.9))),run:()=>{S.price=Math.max(6,Math.round(S.price*.9));say("Cut price to "+money(S.price)+".","");}},
      {label:"Hold and out-spend them",detail:"-"+money(6000)+" · +8 brand",run:()=>{pay(6000,"opex");S.brand=clamp(S.brand+8,1,100);say("Answered with brand spend, not price.","cash");}},
      {label:"Let it go",detail:"-4 brand",run:()=>{S.brand=clamp(S.brand-4,1,100);say("Ceded the ground.","bad");}}]};},
  ()=>({t:"Supplier offer",p:"Materials in bulk, today only.",
   o:[{label:"Buy the pallet",detail:"-"+money(4500)+" · +100 units",run:()=>{pay(4500,"cogs");S.inv+=100;say("Pallet delivered. 100 units in the back.","cash");}},
      {label:"Skip it",detail:"no change",run:()=>say("Passed on the bulk deal.","")}]}),
  ()=>({t:"Poached",p:"A bigger company is dangling offers at your strongest person.",
   o:[{label:"Match the offer",detail:"+$9/hr for them · +18 morale",run:()=>{const b=S.staff.slice().sort((a,c)=>c.skill-a.skill)[0];if(b){b.wage+=9;b.morale=clamp(b.morale+18,0,100);say("Matched the offer for "+b.name+".","");}}},
      {label:"Wish them luck",detail:"they may leave tonight",run:()=>{const b=S.staff.slice().sort((a,c)=>c.skill-a.skill)[0];if(b&&Math.random()<.6){S.staff=S.staff.filter(x=>x.id!==b.id);say(b.name+" took the other job.","bad");}else say("They stayed. For now.","");}}]}),
  ()=>({t:"Someone's burning out",p:(()=>{const p=S.staff.filter(x=>x.morale<55)[0];return p?p.name+" has been running on empty and it shows in the work.":null;})(),
   o:[{label:"Send them home paid",detail:"+22 morale",run:()=>{const p=S.staff.filter(x=>x.morale<55)[0];if(p){pay(p.wage*5,"opex");p.morale=clamp(p.morale+22,0,100);say(p.name+" took the afternoon. Came back better.","");}}},
      {label:"They'll be fine",detail:"-8 morale",run:()=>{const p=S.staff.filter(x=>x.morale<55)[0];if(p){p.morale=clamp(p.morale-8,0,100);say("Pushed through it.","bad");}}}]}),
  ()=>(S.equity>70000?{t:"An approach",p:"A buyer got your number. They've been watching your share climb and they'd like to own it.",
   o:[{label:"Hear the offer",detail:"you can still say no",run:()=>{ exitModal(true,1.15+Math.random()*.15); }},
      {label:"Don't take the meeting",detail:"+4 brand · you look confident",run:()=>{S.brand=clamp(S.brand+4,1,100);say("Turned down a buyer without hearing the number.","");}}]}:null),
  ()=>({t:"Analyst call",p:S.public?"An analyst wants to know your plan for the next quarter. What you say moves the stock.":null,
   o:[{label:"Promise growth",detail:"stock +6% now · next targets get harder",run:()=>{S.stock*=1.06;S.targets.eps*=1.15;say("Talked up growth. The stock liked it; the board wrote it down.","");}},
      {label:"Talk about margins",detail:"stock +2% · no change to targets",run:()=>{S.stock*=1.02;say("Kept it modest on the call.","");}},
      {label:"Say nothing useful",detail:"stock -3%",run:()=>{S.stock*=.97;say("Gave the analyst nothing. The stock slipped.","bad");}}]})
];
function fireEvent(){
  const e=EVENTS[Math.floor(Math.random()*EVENTS.length)]();
  if(!e||!e.p) return;
  showModal({eyebrow:"DAY "+S.day+" · "+pad(S.hour)+":"+pad(S.min),title:e.t,body:"<p>"+e.p+"</p>",
    options:e.o.map(o=>({label:o.label,detail:o.detail,run:o.run}))});
}

/* ── modal / log ───────────────────────────────── */
function showModal(cfg){
  modalOpen=true; modalOpts=cfg.options||[];
  document.getElementById("sheet").innerHTML=
    (cfg.stamp?"<div class='stamp"+(cfg.stampOk?" ok":"")+"'>"+cfg.stamp+"</div>":"")+
    "<div class='eyebrow'>"+cfg.eyebrow+"</div><h2>"+cfg.title+"</h2>"+cfg.body+
    "<div class='opts'>"+modalOpts.map((o,i)=>"<button class='opt' data-act='opt' data-i='"+i+"'><strong>"+o.label+"</strong><em>"+(o.detail||"")+"</em></button>").join("")+"</div>";
  document.getElementById("veil").hidden=false;
  const f=document.querySelector("#sheet .opt"); if(f) f.focus();
}
function closeModal(){ modalOpen=false; document.getElementById("veil").hidden=true; }
function say(msg,kind){
  S.log.unshift({t:"D"+S.day+" "+pad(S.hour)+":"+pad(S.min),msg,kind:kind||""});
  if(S.log.length>70) S.log.pop();
}

/* ── paint ─────────────────────────────────────── */
function paint(){
  const h=Math.floor(S.hour);
  document.getElementById("clock").textContent=pad(h)+":"+pad(S.min);
  document.getElementById("dayLbl").textContent="DAY "+S.day+" · Q"+S.quarter+" · "+(QDAYS-(S.day-1)%QDAYS)+"D TO "+(S.public?"BOARD":"BOOKS");
  const cn=document.getElementById("cashNum");
  cn.textContent=money(S.cash); cn.className=S.cash<0?"neg":"";
  document.getElementById("cashLbl").textContent=S.accrued>0?"CASH · "+money(S.accrued)+" WAGES OWED":"CASH";
  document.getElementById("play").textContent=S.speed===0?"▶":"❚❚";
  document.getElementById("play").classList.toggle("on",S.speed!==0);
  document.getElementById("spd").textContent=(S.lastSpeed||1)+"×";

  const sl=document.getElementById("slots").children;
  for(let i=0;i<HOURS;i++){
    const hn=OPEN+i, el=sl[i]; if(!el) continue;
    el.classList.toggle("done",h>hn);
    el.querySelector("i").style.width=(h>hn?100:h===hn?S.min/60*100:0)+"%";
  }
  const cells=[
    ["In the back",Math.floor(S.inv)+"",S.inv>market().mine*HOURS*2?"neg":""],
    ["Sold today",Math.floor(S.dayUnits)+"",""],
    ["Revenue today",money(S.dayRev),"pos"],
    ["Share",(S.share*100).toFixed(1)+"%",""],
    ["Quality",S.qual.toFixed(1),""],
    ["Brand",Math.round(S.brand)+"",""],
    S.public?["Share price","$"+S.stock.toFixed(2),""]:["Equity",money(S.equity),S.equity<0?"neg":""],
    ["Rating",S.rating,S.rating==="D"?"neg":S.rating==="A"?"pos":""],
    ["Debt",money(S.loan),S.loan>0?"neg":""]
  ];
  const led=document.getElementById("ledger");
  if(led.children.length!==cells.length) led.innerHTML=cells.map(()=>"<div class='cell'><u></u><b></b></div>").join("");
  cells.forEach((c,i)=>{const e=led.children[i];e.children[0].textContent=c[0];e.children[1].textContent=c[1];e.children[1].className=c[2];});
}

function render(){
  const flag=(S.public&&S.strikes)||(!S.public&&ipoReady());
  const items=[
    ["floor","Floor",""],
    ["staff","Staff",S.staff.length?"<em>"+S.staff.length+"</em>":""],
    ["hire","Hire","<em>"+S.pool.length+"</em>"],
    ["build","Build",""],
    ["strategy","Plans",S.jobs.length?"<em>"+S.jobs.length+" live</em>":""],
    ["deals","Deals",S.subs.length?"<em>"+S.subs.length+" owned</em>":""],
    ["market","Market","<em>"+(S.share*100).toFixed(0)+"%</em>"],
    ["board",S.public?"Board":"Books",S.public&&S.strikes?"<em>"+S.strikes+" strikes</em>":(!S.public&&ipoReady()?"<em>IPO</em>":"")],
    ["log","Log",""]
  ];
  document.getElementById("tabs").innerHTML=items.map(t=>
    "<button class='tab"+(tab===t[0]?" on":"")+(t[0]==="board"&&flag?" flag":"")+"' data-act='tab' data-v='"+t[0]+"'>"+
    "<span>"+t[1]+"</span>"+(t[2]||"")+"</button>").join("");

  document.getElementById("panel").innerHTML=
    tab==="floor"?floorHTML():tab==="staff"?staffHTML():tab==="hire"?hireHTML():
    tab==="build"?buildHTML():tab==="strategy"?stratHTML():tab==="deals"?dealsHTML():
    tab==="market"?marketHTML():tab==="log"?logHTML():boardHTML();

  const on=document.querySelector(".tab.on");
  if(on&&on.scrollIntoView) try{on.scrollIntoView({inline:"center",block:"nearest",behavior:"smooth"});}catch(e){}
  document.getElementById("panel").scrollTop=0;
  paint();
}

function logHTML(){
  return "<h3 class='sec'>What's happened</h3>"+
    (S.log.length?S.log.map(e=>"<div class='entry "+e.kind+"'><time>"+e.t+"</time><span>"+e.msg+"</span></div>").join("")
      :"<p class='empty'>Nothing yet.</p>")+
    "<h3 class='sec'>Saving</h3>"+
    "<div class='row flat'><div class='nm'>"+(STORE.ok?"Saves to this device automatically":"This browser is blocking storage")+"</div>"+
    "<div class='meta'>"+(STORE.ok
      ? savedAgo()+" · also saves every time you close the tab or switch apps. Just open the file again and it picks up where you left off."
      : "Private browsing or a locked-down viewer. Copy the save code below and keep it, or open the file from your home screen instead.")+"</div></div>"+
    "<div class='acts' style='margin-top:14px'>"+
    "<button class='btn alt' data-act='help'>How it works</button>"+
    "<button class='btn alt' data-act='save'>Save code</button>"+
    "<button class='btn alt' data-act='load'>Load a code</button>"+
    "<button class='btn alt' data-act='wipe'>Delete save</button></div>";
}

function floorHTML(){
  const b=buildRate(),s=sellRate(),w=market().mine,max=Math.max(b,s,w,1);
  const read=b<=s&&b<=w?"You can't build fast enough. More builders, better tools, or a production cell."
    :s<=w?"Units and buyers are there, nobody to close. Hire a closer or buy the sales system."
    :"Demand is the ceiling. That's a strategy problem: price, quality, brand, or a new region.";
  const flow=[["Built per hour",b,""],["Could sell per hour",s,"sales"],["Buyers who want it, per hour",w,"mkt"]];
  return "<h3 class='sec'>Price</h3><div class='pricebox'><div class='val' id='pv'>"+money(S.price)+"</div>"+
    "<input class='slider' type='range' min='6' max='320' value='"+S.price+"' data-act='price'>"+
    "<p class='hint'>Costs <b>"+money(matCost())+"</b> in materials the moment you build it"+(shipAvg()>0?", plus "+money(shipAvg())+" to ship":"")+" · margin <b>"+money(S.price-unitCost())+"</b>. "+
    "Rivals sit at "+S.rivals.map(r=>money(r.price)).join(" / ")+". Price low and you win Budget; price high and you'd better have the quality.</p></div>"+
    "<h3 class='sec'>Where the hours go</h3>"+
    flow.map(f=>"<div class='row flat "+f[2]+"'><div><div class='nm'>"+f[1].toFixed(1)+" <span style='font-size:12px;font-weight:400;color:#8FA6B3'>units</span></div>"+
      "<div class='meta'>"+f[0]+"</div><div class='bar'><i style='width:"+(f[1]/max*100)+"%'></i></div></div></div>").join("")+
    (S.dayLost>1?"<p class='hint' style='color:var(--stamp)'>"+Math.round(S.dayLost)+" buyers walked today because you had nothing to give them. That costs brand.</p>":"")+
    (S.inv>market().mine*HOURS*2?"<p class='hint' style='color:var(--amber)'>"+Math.round(S.inv)+" units sitting in the back — over two days of sales. Every one cost you "+money(matCost())+" to make. Move people off the line or find more buyers.</p>":"")+
    "<h3 class='sec'>Read</h3><p class='hint' style='font-size:13.5px'>"+read+"</p>"+
    "<h3 class='sec'>Due tonight</h3>"+
    "<div class='row flat'><div><div class='nm'>"+money(payrollDay())+"</div><div class='meta'>payroll · "+S.staff.length+" people</div></div></div>"+
    "<div class='row flat'><div><div class='nm'>"+money(upkeepDay())+"</div><div class='meta'>rent and machine upkeep · "+BUILDS[0].after(S.lv.office)+"</div></div></div>"+
    (S.jobs.length?"<div class='row flat rnd'><div><div class='nm'>"+money(jobDaily())+"</div><div class='meta'>project spend · "+S.jobs.map(j=>j.name.toLowerCase()).join(", ")+"</div></div></div>":"")+
    (S.loan>0?"<div class='row flat ops'><div><div class='nm'>"+money(S.loan)+"</div><div class='meta'>debt at rating "+S.rating+"</div></div></div>":"");
}

function staffHTML(){
  const job=OWNER_JOBS.find(j=>j.id===S.owner.focus);
  let h="<h3 class='sec'>You · where your ten hours go</h3>"+
    "<div class='jobs'>"+
    OWNER_JOBS.map(j=>"<button class='btn"+(S.owner.focus===j.id?" go":" alt")+"' data-act='focus' data-v='"+j.id+"'>"+j.label+"</button>").join("")+"</div>"+
    "<p class='hint'>"+job.note+"</p>";

  h+="<h3 class='sec'>Departments</h3>";
  DEPTS.forEach(d=>{
    const head=deptHead(d.id), n=S.staff.filter(p=>d.roles.includes(p.role)).length, m=deptMult(d.id);
    h+="<div class='row"+(head?" ops":" flat")+"'><div class='nm'>"+d.name+" <span style='font-size:12px;font-weight:400;color:#8FA6B3'>×"+m.toFixed(2)+"</span></div>"+
      "<div class='meta'>"+n+" on it · "+d.note+" · "+(head?"run by "+head.name:"<span style='color:var(--amber)'>no manager assigned</span>")+"</div></div>";
  });
  if(!of("ops").length) h+="<p class='hint'>Hire a manager and put them over a department — an unassigned manager barely moves anything.</p>";

  h+="<h3 class='sec'>On the books · "+S.staff.length+" of "+capacity()+" desks</h3>";
  if(!S.staff.length) return h+"<p class='empty'>Nobody but you. Go to Hire — a closer first, if you're building faster than you're selling.</p>";
  h+=S.staff.map(p=>{
    const cls=p.morale<30?"bad":p.morale<60?"warn":"";
    let acts="";
    if(p.role==="ops"){
      acts=DEPTS.map(d=>"<button class='btn"+(p.dept===d.id?" go":" alt")+"' data-act='assign' data-id='"+p.id+"' data-d='"+d.id+"'>"+d.name.split(" ")[0]+"</button>").join("");
    } else if(p.skill>=4){
      acts="<button class='btn alt' data-act='promote' data-id='"+p.id+"'>Promote to manager</button>";
    }
    return "<div class='row "+p.role+"'><div><div class='nm'>"+p.name+"</div>"+
      "<div class='meta'><span class='role'>"+ROLES[p.role].label+"</span>"+(p.role==="ops"?(p.dept?" · "+DEPTS.find(d=>d.id===p.dept).name:" · unassigned"):"")+
      " · skill "+p.skill+" · "+money(p.wage)+"/hr · "+money(p.wage*HOURS)+"/day · "+p.days+" days</div>"+
      "<div class='bar'><i class='"+cls+"' style='width:"+p.morale+"%'></i></div>"+
      (acts?"<div class='acts' style='justify-content:flex-start;margin-top:8px'>"+acts+"</div>":"")+
      "</div><div class='acts'>"+
      "<button class='btn' data-act='bonus' data-id='"+p.id+"' "+(S.cash<p.wage*HOURS?"disabled":"")+">Bonus</button>"+
      "<button class='btn alt' data-act='fire' data-id='"+p.id+"'>Let go</button></div></div>";}).join("");
  return h;
}

function buildHTML(){
  return "<h3 class='sec'>Capital spending · lands immediately</h3><div class='build'>"+
    BUILDS.map(b=>{const lv=S.lv[b.id],max=lv>=b.max,c=max?0:b.cost(lv);
      return "<div class='item'><h4>"+b.name+"</h4><div class='lvl'>"+b.after(lv)+"</div>"+
      "<p>"+(max?"Nothing more to add here.":b.desc(lv))+"</p>"+
      "<div class='buy'><span class='price'>"+(max?"—":money(c))+"</span>"+
      "<button class='btn"+(max?" alt":"")+"' data-act='buy' data-id='"+b.id+"' "+(max||S.cash<c?"disabled":"")+">"+(max?"Done":"Buy")+"</button></div></div>";}).join("")+"</div>";
}

function stratHTML(){
  const speed=(1+of("rnd").reduce((a,p)=>a+p.skill*.09,0))*deptMult("rnd");
  let h="<h3 class='sec'>Running now · "+S.jobs.length+" of 2</h3>";
  h+=S.jobs.length?S.jobs.map((j,i)=>"<div class='row rnd'><div><div class='nm'>"+j.name+"</div>"+
      "<div class='meta'>"+money(j.daily)+"/day · "+Math.ceil(j.left/speed)+" day"+(Math.ceil(j.left/speed)===1?"":"s")+" left · "+money(j.spent)+" spent</div>"+
      "<div class='bar'><i class='blue' style='width:"+((j.days-j.left)/j.days*100)+"%'></i></div></div>"+
      "<div class='acts'><button class='btn alt' data-act='kill' data-i='"+i+"'>Cancel</button></div></div>").join("")
    :"<p class='empty'>Nothing in the pipeline. Everything you do today is operations — the board wants to see next quarter.</p>";
  if(of("rnd").length) h+="<p class='hint'>Your designers move projects "+speed.toFixed(2)+"× faster.</p>";
  h+="<h3 class='sec'>Start something · paid daily, lands later</h3><div class='build'>";
  h+=PROJECTS.map(p=>{
    const lv=S.plv[p.kind], maxed=lv>=p.max, running=S.jobs.some(j=>j.kind===p.kind);
    const c=maxed?0:p.cost(lv), daily=Math.round(c/p.days);
    const blocked=maxed||running||S.jobs.length>=2||S.cash<daily*1.5;
    return "<div class='item'><h4>"+p.name+"</h4>"+
      "<div class='lvl'>"+(maxed?"complete":p.days+" days · "+money(daily)+"/day")+"</div>"+
      "<p>"+p.desc+"</p><div class='buy'><span class='price'>"+(maxed?"—":money(c))+"</span>"+
      "<button class='btn"+(maxed?" alt":" go")+"' data-act='start' data-k='"+p.kind+"' "+(blocked?"disabled":"")+">"+
      (maxed?"Done":running?"Running":"Start")+"</button></div></div>";}).join("");
  return h+"</div>";
}

function marketHTML(){
  const M=market(), names=["you"].concat(S.rivals.map(r=>r.name));
  let h="<h3 class='sec'>Your position</h3>"+
    "<div class='row flat'><div>"+
    "<div class='gauge'><span>Price</span><div class='bar' style='max-width:none'><i style='width:"+clamp(S.price/120*100,2,100)+"%'></i></div><span>"+money(S.price)+"</span></div>"+
    "<div class='gauge'><span>Quality</span><div class='bar' style='max-width:none'><i class='blue' style='width:"+S.qual*10+"%'></i></div><span>"+S.qual.toFixed(1)+"/10</span></div>"+
    "<div class='gauge'><span>Brand</span><div class='bar' style='max-width:none'><i class='warn' style='width:"+S.brand+"%'></i></div><span>"+Math.round(S.brand)+"/100</span></div>"+
    "</div></div>";
  h+="<h3 class='sec'>Markets · "+Math.round(M.total)+" buyers/hour in play, you reach "+M.mine.toFixed(1)+"</h3>";
  REGIONS.forEach(r=>{
    const open=S.regions[r.id], size=S.mkt[r.id];
    h+="<div class='row flat'><div><div class='nm'>"+r.name+" <span style='font-size:12px;font-weight:400;color:#8FA6B3'>"+size.toFixed(1)+" buyers/hr"+(r.ship?" · $"+(r.ship*(1-.30*S.lv.logi)).toFixed(2)+"/unit shipping":"")+"</span></div>";
    if(!open) h+="<div class='meta' style='color:var(--stamp)'>not open to you — start the entry project under Strategy</div>";
    M.cells.filter(c=>c.r.id===r.id).forEach(c=>{
      const parts=[{n:"you",v:c.open?c.me:0,cls:"you"}].concat(c.rv.map((v,i)=>({n:S.rivals.filter(x=>x.in[r.id])[i].name,v,cls:"r"+i})));
      const tot=parts.reduce((a,p)=>a+p.v,0)||1;
      h+="<div style='margin-top:9px'><div class='meta'>"+c.sg.name+" · "+c.dem.toFixed(1)+" buyers/hr"+(c.open?" · you take "+(c.sh*100).toFixed(0)+"%":"")+"</div>"+
        "<div class='stack'>"+parts.map(p=>{const w=p.v/tot*100;return w<1?"":"<span class='"+p.cls+"' style='width:"+w+"%'>"+(w>13?Math.round(w)+"%":"")+"</span>";}).join("")+"</div></div>";
    });
    h+="</div></div>";
  });
  h+="<div class='key'><span><i class='you'></i>you</span>"+S.rivals.map((r,i)=>"<span><i class='r"+i+"'></i>"+r.name+"</span>").join("")+"</div>";
  h+="<h3 class='sec'>The rivals</h3>";
  h+=S.rivals.map(r=>{
    const where=REGIONS.filter(x=>r.in[x.id]).map(x=>x.name).join(", ");
    const tag={cost:"undercuts everyone and lives in Budget",volume:"chases Mainstream volume and reacts when you grow",premium:"invests in quality and refuses to discount"}[r.mode];
    return "<div class='row flat'><div><div class='nm'>"+r.name+"</div>"+
      "<div class='meta'>"+money(r.price)+" · quality "+r.qual.toFixed(1)+" · brand "+Math.round(r.brand)+" · "+where+"</div>"+
      "<div class='meta' style='color:#7E97A6'>"+tag+"</div></div></div>";}).join("");
  return h;
}

function dealsHTML(){
  const cash=S.cash, room=Math.max(0,S.credit-S.loan);
  let h="<h3 class='sec'>On the market · refreshes every quarter</h3>";
  h+=S.deals.length?"<div class='build'>"+S.deals.map(d=>{
    const k=dealKind(d.kind), afford=cash>=d.price, fin=cash+room>=d.price;
    return "<div class='item'><h4>"+d.name+"</h4><div class='lvl'>"+k.tag+" · "+money(d.upkeep)+"/day to run</div>"+
      "<p>"+k.blurb+"</p><div class='buy'><span class='price'>"+money(d.price)+"</span>"+
      "<button class='btn"+(afford?" go":" alt")+"' data-act='buybiz' data-id='"+d.id+"' "+(fin?"":"disabled")+">"+
      (afford?"Buy":fin?"Finance":"Too rich")+"</button></div></div>";}).join("")+"</div>"
    :"<p class='empty'>Nothing on the market you can use right now. Check back next quarter.</p>";
  h+="<div style='margin-top:10px'><button class='btn alt' data-act='reroll' "+(S.cash<2500?"disabled":"")+">Call the broker · $2,500 for fresh listings</button></div>";

  h+="<h3 class='sec'>Buy out a rival · removes them from every market they're in</h3>";
  h+=S.rivals.length?S.rivals.map(r=>{
    const v=rivalValue(r), fin=S.cash+Math.max(0,S.credit-S.loan)>=v;
    const where=REGIONS.filter(x=>r.in[x.id]).map(x=>x.name).join(", ");
    const newRegions=REGIONS.filter(x=>r.in[x.id]&&!S.regions[x.id]).map(x=>x.name);
    return "<div class='row flat'><div><div class='nm'>"+r.name+" <span style='font-size:12px;font-weight:400;color:#8FA6B3'>"+money(r.price)+" · quality "+r.qual.toFixed(1)+" · brand "+Math.round(r.brand)+"</span></div>"+
      "<div class='meta'>sells in "+where+" · their share falls to you"+(newRegions.length?" · <span style='color:var(--amber)'>opens "+newRegions.join(" and ")+"</span>":"")+"</div>"+
      "<div class='meta'>running costs after close: "+money(Math.round(v*.004))+"/day</div></div>"+
      "<div class='acts'><button class='btn"+(S.cash>=v?" go":" alt")+"' data-act='buyrival' data-n='"+r.name+"' "+(fin?"":"disabled")+">"+money(v)+"</button></div></div>";}).join("")
    :"<p class='empty'>You own the whole market. There is nobody left to buy.</p>";

  h+="<h3 class='sec'>What you own</h3>";
  h+=S.subs.length?S.subs.map((x,i)=>"<div class='row flat ops'><div><div class='nm'>"+x.name+"</div>"+
      "<div class='meta'>"+x.tag+" · bought for "+money(x.paid)+" · "+money(x.upkeep)+"/day</div></div>"+
      "<div class='acts'><button class='btn alt' data-act='sellsub' data-i='"+i+"'>Sell for "+money(x.paid*.6)+"</button></div></div>").join("")
    :"<p class='empty'>No subsidiaries yet. Anything you buy shows up here, and you can sell it back at 60% when cash gets tight.</p>";
  if(S.cells>0) h+="<div class='row flat'><div><div class='nm'>"+S.cells+" production cell"+(S.cells===1?"":"s")+"</div>"+
    "<div class='meta'>machine capacity you built · "+money(S.cells*260)+"/day upkeep</div></div>"+
    "<div class='acts'><button class='btn alt' data-act='sellcell'>Sell one for "+money(15000)+"</button></div></div>";

  h+="<h3 class='sec'>The exit</h3>";
  const px=S.public?Math.round(marketCap()*1.1):Math.round(valuation()*.9);
  h+="<div class='row flat'><div><div class='nm'>"+money(px)+"</div>"+
    "<div class='meta'>"+(S.public?"a buyer would pay about 10% over market cap":"what a buyer would pay if you went looking today")+"</div>"+
    "<div class='meta' style='color:#7E97A6'>selling ends the run — you walk away with the money and a final number</div></div>"+
    "<div class='acts'><button class='btn alt' data-act='sellco'>Sell the company</button></div></div>";
  return h;
}

function boardHTML(){
  const A=S.acct, gross=A.rev-A.cogs, op=gross-A.opex-A.dep, pre=op-A.int;
  const left=QDAYS-(S.day-1)%QDAYS;
  let h="<h3 class='sec'>Quarter "+S.quarter+" so far · "+left+" day"+(left===1?"":"s")+" to close</h3>"+
    "<table class='rows' style='color:#DCD4BE'>"+
    "<tr><td>Revenue · "+Math.round(A.units)+" units</td><td>"+money(A.rev)+"</td></tr>"+
    "<tr><td>Cost of goods</td><td>-"+money(A.cogs)+"</td></tr>"+
    "<tr><td>Operating costs</td><td>-"+money(A.opex)+"</td></tr>"+
    "<tr><td>Depreciation &amp; interest</td><td>-"+money(A.dep+A.int)+"</td></tr>"+
    "<tr class='tot'><td>Pre-tax</td><td>"+money(pre)+"</td></tr></table>";

  if(!S.public){
    const checks=ipoCheck(), ready=ipoReady();
    h+="<h3 class='sec'>Going public</h3>"+
      checks.map(c=>"<div class='tgt "+(c.got>=c.need?"hit":"miss")+"'><span>"+c.n+"</span><span>"+c.f(c.got)+" of "+c.f(c.need)+"</span></div>").join("")+
      "<p class='hint'>"+(ready?"You clear every bar. The underwriter will call at the next quarter close — or ring the bell now.":
        "Clear all four and an underwriter comes calling at quarter close. Until then nobody can fire you.")+"</p>"+
      (ready?"<div style='margin-bottom:14px'><button class='btn go' data-act='ipo'>Take the company public · valued around "+money(valuation())+"</button></div>":"");
  }else{
    const t=S.targets, epsNow=(pre>0?pre*.75:pre)/S.shares;
    const line=(n,got,need,f)=>"<div class='tgt "+(got>=need?"hit":"miss")+"'><span>"+n+"</span><span>"+f(got)+" vs "+f(need)+"</span></div>";
    h+="<h3 class='sec'>What the board asked for</h3>"+
      line("Earnings per share",epsNow,t.eps,v=>"$"+v.toFixed(2))+
      line("Market share",S.share*100,t.share,v=>v.toFixed(1)+"%")+
      line("Share price",S.stock,t.stock,v=>"$"+v.toFixed(2))+
      "<p class='hint'>Hit two of three or take a strike. Three strikes and they replace you."+(S.strikes?" <b style='color:var(--stamp)'>You have "+S.strikes+".</b>":"")+"</p>";
  }

  h+="<h3 class='sec'>Balance sheet</h3>"+
    "<div class='row flat'><div><div class='nm'>"+money(S.equity)+"</div><div class='meta'>"+(S.public?"book equity · "+S.shares.toLocaleString()+" shares out":"owner equity · all yours")+"</div></div></div>"+
    "<div class='row flat'><div><div class='nm'>"+money(S.plant)+"</div><div class='meta'>plant and equipment, after depreciation</div></div></div>"+
    "<div class='row flat"+(S.loan?" ops":"")+"'><div><div class='nm'>"+money(S.loan)+" <span style='font-size:12px;font-weight:400;color:#8FA6B3'>of "+money(S.credit)+" credit line</span></div>"+
      "<div class='meta'>rating "+S.rating+" · "+({A:"0.6",B:"1.0",C:"1.7",D:"2.6"}[S.rating])+"%/day</div></div>"+
      (S.loan&&S.cash>=S.loan?"<div class='acts'><button class='btn' data-act='repay'>Pay it off</button></div>":"")+"</div>"+
    (S.public?"<div class='row flat'><div><div class='nm'>"+money(marketCap())+"</div><div class='meta'>market cap · $4,000,000 ends the game</div></div></div>":"")+
    (S.epsHist.length?"<h3 class='sec'>EPS by quarter</h3><p class='hint' style='font-family:var(--mono)'>"+S.epsHist.map((e,i)=>"Q"+(i+1)+" $"+e.toFixed(2)).join("   ")+"</p>":"");
  return h;
}

/* ── input ─────────────────────────────────────── */
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]"); if(!el) return;
  const a=el.dataset.act;
  if(a==="toggle"){ S.speed=S.speed===0?(S.lastSpeed||1):0; paint(); }
  if(a==="cycle"){ const seq=[1,3,8]; S.lastSpeed=seq[(seq.indexOf(S.lastSpeed||1)+1)%3];
    if(S.speed!==0) S.speed=S.lastSpeed; paint(); }
  if(a==="tab"){tab=el.dataset.v;render();}
  if(a==="opt"){const o=modalOpts[+el.dataset.i];closeModal();o.run();if(!modalOpen)render();}
  if(a==="help") helpModal();
  if(a==="save") doSave();
  if(a==="load") doLoad();
  if(a==="hire"){
    const p=S.pool[+el.dataset.i]; if(!p) return;
    const b=p.wage*HOURS; if(S.cash<b||S.staff.length>=capacity()) return;
    pay(b,"opex"); S.pool.splice(+el.dataset.i,1); S.staff.push(p);
    say("Hired "+p.name+" as "+ROLES[p.role].label.toLowerCase()+" at "+money(p.wage)+"/hr.",""); render();
  }
  if(a==="repost"){ if(S.cash<600) return; pay(600,"opex"); refreshPool(); render(); }
  if(a==="bonus"){
    const p=S.staff.find(x=>x.id===el.dataset.id); if(!p||S.cash<p.wage*HOURS) return;
    pay(p.wage*HOURS,"opex"); p.morale=clamp(p.morale+20,0,100); say("Gave "+p.name+" a bonus.","cash"); render();
  }
  if(a==="fire"){
    const p=S.staff.find(x=>x.id===el.dataset.id); if(!p) return;
    pay(p.wage*16,"opex"); S.staff=S.staff.filter(x=>x.id!==p.id);
    S.staff.forEach(x=>x.morale=clamp(x.morale-6,0,100));
    say("Let "+p.name+" go. Severance "+money(p.wage*16)+".","bad"); render();
  }
  if(a==="buy"){
    const b=BUILDS.find(x=>x.id===el.dataset.id), lv=S.lv[b.id];
    if(lv>=b.max) return; const c=b.cost(lv); if(S.cash<c) return;
    pay(c,b.capex?"capex":"opex"); S.lv[b.id]++;
    say("Bought "+b.name.toLowerCase()+" — now "+b.after(S.lv[b.id])+".","cash"); render();
  }
  if(a==="start"){
    const p=PROJECTS.find(x=>x.kind===el.dataset.k);
    if(!p||S.jobs.length>=2||S.plv[p.kind]>=p.max||S.jobs.some(j=>j.kind===p.kind)) return;
    const c=p.cost(S.plv[p.kind]);
    S.plv[p.kind]++;
    S.jobs.push({kind:p.kind,name:p.name,days:p.days,left:p.days,daily:Math.round(c/p.days),spent:0});
    say("Started "+p.name.toLowerCase()+" · "+money(Math.round(c/p.days))+"/day for "+p.days+" days.","big"); render();
  }
  if(a==="kill"){
    const j=S.jobs.splice(+el.dataset.i,1)[0]; if(!j) return;
    S.plv[j.kind]=Math.max(0,S.plv[j.kind]-1);
    say("Cancelled "+j.name.toLowerCase()+". "+money(j.spent)+" spent for nothing.","bad"); render();
  }
  if(a==="focus"){ S.owner.focus=el.dataset.v; say("You moved to "+OWNER_JOBS.find(j=>j.id===el.dataset.v).label.toLowerCase()+".",""); render(); }
  if(a==="assign"){
    const p=S.staff.find(x=>x.id===el.dataset.id); if(!p) return;
    p.dept = p.dept===el.dataset.d ? null : el.dataset.d;
    say(p.dept?p.name+" now runs "+DEPTS.find(d=>d.id===p.dept).name+".":p.name+" is off the department.",""); render();
  }
  if(a==="promote"){
    const p=S.staff.find(x=>x.id===el.dataset.id); if(!p||p.skill<4) return;
    p.role="ops"; p.dept=null; p.wage=Math.round(p.wage*1.25/5)*5; p.morale=clamp(p.morale+12,0,100);
    say("Promoted "+p.name+" to manager at "+money(p.wage)+"/hr. Assign them to a department.","big"); render();
  }
  if(a==="ipo"){ if(ipoReady()) ipoModal(); }
  if(a==="reroll"){ if(S.cash<2500) return; pay(2500,"opex"); S.deals=[]; rollDeals(); say("Broker sent a fresh list.",""); render(); }
  if(a==="buybiz"){
    const d=S.deals.find(x=>x.id===el.dataset.id); if(!d) return;
    const k=dealKind(d.kind), room=Math.max(0,S.credit-S.loan);
    if(S.cash+room<d.price) return;
    const borrow=Math.max(0,d.price-S.cash);
    const close=()=>{
      if(borrow){ S.loan+=borrow; S.cash+=borrow; }
      pay(d.price,"capex"); k.apply();
      S.subs.push({kind:d.kind,name:d.name,tag:k.tag,paid:d.price,upkeep:d.upkeep});
      S.deals=S.deals.filter(x=>x.id!==d.id); rollDeals();
      say("Bought "+d.name+" for "+money(d.price)+(borrow?", "+money(borrow)+" of it borrowed":"")+".","big");
      closeModal(); render();
    };
    if(!borrow){ close(); return; }
    showModal({eyebrow:"FINANCING",title:"You're short",
      body:"<p>"+d.name+" costs "+money(d.price)+" and you have "+money(S.cash)+". You can draw "+money(borrow)+" on the credit line at "+({A:"0.6",B:"1.0",C:"1.7",D:"2.6"}[S.rating])+"% a day, leaving "+money(room-borrow)+" of room for payroll.</p>",
      options:[{label:"Borrow and close the deal",detail:"+"+money(borrow)+" debt",run:close},
               {label:"Walk away",detail:"the listing stays up",run:()=>closeModal()}]});
  }
  if(a==="buyrival"){
    const r=S.rivals.find(x=>x.name===el.dataset.n); if(!r) return;
    const v=rivalValue(r), room=Math.max(0,S.credit-S.loan);
    if(S.cash+room<v) return;
    const borrow=Math.max(0,v-S.cash);
    const close=()=>{
      if(borrow){ S.loan+=borrow; S.cash+=borrow; }
      pay(v,"capex");
      REGIONS.forEach(reg=>{ if(r.in[reg.id]) S.regions[reg.id]=true; });
      S.brand=clamp(S.brand+8,1,100);
      S.qual=Math.min(10,S.qual+(r.qual>S.qual?.7:.25));
      S.subs.push({kind:"acquired",name:r.name,tag:"Former rival",paid:v,upkeep:Math.round(v*.004)});
      S.rivals=S.rivals.filter(x=>x.name!==r.name);
      say("Acquired "+r.name+" for "+money(v)+". Their customers are yours now.","big");
      closeModal(); render();
    };
    showModal({eyebrow:"ACQUISITION",title:"Buy "+r.name,
      body:"<p>"+money(v)+" takes them off the board. Their share flows to whoever is left — mostly you — and you inherit their footprint, "+
        "plus a little of their brand and quality. Running what you bought costs "+money(Math.round(v*.004))+" a day.</p>"+
        (borrow?"<p>You're "+money(borrow)+" short. That comes off the credit line.</p>":""),
      options:[{label:borrow?"Borrow and close":"Close the deal",detail:money(v),run:close},
               {label:"Not yet",detail:"they keep selling",run:()=>closeModal()}]});
  }
  if(a==="sellsub"){
    const x=S.subs[+el.dataset.i]; if(!x) return;
    const back=Math.round(x.paid*.6);
    S.cash+=back; S.plant=Math.max(0,S.plant-x.paid);
    if(x.kind!=="acquired") dealKind(x.kind).undo();
    S.subs.splice(+el.dataset.i,1);
    say("Sold "+x.name+" for "+money(back)+".","cash"); render();
  }
  if(a==="sellcell"){
    if(S.cells<1) return; S.cells--; S.cash+=15000; S.plant=Math.max(0,S.plant-15000);
    say("Sold a production cell for "+money(15000)+".","cash"); render();
  }
  if(a==="sellco") exitModal(false);
  if(a==="repay"){ if(S.cash<S.loan) return; S.cash-=S.loan; say("Cleared "+money(S.loan)+" of debt.","cash"); S.loan=0; rate(); render(); }
  if(a==="wipe") wipeSave();
  autosave();
});

    const pv=document.getElementById("pv"); if(pv) pv.textContent=money(S.price); }

document.addEventListener("keydown",e=>{
  if(e.key===" "&&!modalOpen&&e.target.tagName!=="INPUT"){ e.preventDefault(); S.speed=S.speed===0?(S.lastSpeed||1):0; paint(); }
});
